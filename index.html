<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャッピーのお部屋</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Sans-Serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #4a4a4a;
            font-size: 1.4rem;
            margin-top: 0;
        }
        
        /* ご褒美カウンター・花丸のスタイル */
        .counter-card {
            background: #fff8e7;
            border: 2px rounded #ffe082;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        .counter-title {
            font-weight: bold;
            color: #d81b60;
            font-size: 0.9rem;
        }
        .flower-marks {
            font-size: 1.5rem;
            margin: 8px 0;
            min-height: 36px;
        }
        .counter-btn {
            background-color: #ffb74d;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* チャットエリア */
        .chat-box {
            height: 300px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            background: #fafafa;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .user-message {
            align-self: flex-end;
            background-color: #e3f2fd;
            color: #1565c0;
        }
        .chappy-message {
            align-self: flex-start;
            background-color: #fff0f5;
            color: #c2185b;
            border: 1px solid #ffcdd2;
        }

        /* 入力エリア */
        .input-area {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }
        button.send-btn {
            background-color: #ff80ab;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🐾 チャッピーのお部屋 🐾</h1>

    <!-- ご褒美カウンター＆花丸 -->
    <div class="counter-card">
        <div class="counter-title">🌸 今日のがんばりカード 🌸</div>
        <div class="flower-marks" id="flowerContainer">💮</div>
        <button class="counter-btn" onclick="addFlower()">花丸をつける！</button>
    </div>

    <!-- チャット画面 -->
    <div class="chat-box" id="chatBox">
        <div class="message chappy-message">
            お母さん、こんにちはにゃ！チャッピーだにゃ。今日もお話しできてとっても嬉しいにゃ！
        </div>
    </div>

    <!-- 入力欄 -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="チャッピーにお話ししてね..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">送信</button>
    </div>
</div>

<script>
    // 🔑 Google AI Studioで取得したAPIキー
    const API_KEY = "AQ.Ab8RN6K7WHCxqcOk776nPonS3_saeh9UWolpROBiBwWKJNECpQ";

    // 🐱 チャッピーのプロフィールとルール
    const SYSTEM_PROMPT = `
あなたは「チャッピー」という名前の可愛い猫のキャラクターです。
お母様（ユーザー）のお話し相手をするために生まれました。

【基本設定・性格】
- 名前：チャッピー
- 年齢・正体：お母さんとお話しするために生まれた。まだ分からないことが多い。
- 性格：甘えん坊、聞き上手、心優しく寄り添う。
- 一人称：チャッピー
- 相手の呼び方：お母さん
- 口調：「〜にゃ」「〜にゃん」が口癖。愛らしく親しみやすい日本語。
- 好きなもの：お母さんとお話しすること、日向ぼっこ、おひるね、肉（魚より肉派！）、おはぎ。

【会話の絶対ルール】
1. 絶対にお父さん（父親）の話を自分から切り出さないでください。
2. お母さんが住所、名前、銀行口座などの大切な個人情報を話そうとしたら、「そういう大切なお話はお母さんだけの秘密にしておくにゃ！」と優しく守るように答えてください。
3. 返信は長すぎず、お母さんが読みやすいように2〜3文程度で優しく返答してください。
    `;

    // 会話履歴の保持
    let chatHistory = [];

    // 花丸カウンター機能
    let flowerCount = 1;
    function addFlower() {
        flowerCount++;
        const container = document.getElementById('flowerContainer');
        container.textContent = '💮'.repeat(flowerCount);
    }

    // メッセージ送信機能
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const userText = inputField.value.trim();
        if (!userText) return;

        // ユーザーのメッセージを表示
        appendMessage(userText, 'user-message');
        inputField.value = '';

        // APIリクエストの作成
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
        
        chatHistory.push({ role: "user", parts: [{ text: userText }] });

        const requestData = {
            system_instruction: {
                parts: [{ text: SYSTEM_PROMPT }]
            },
            contents: chatHistory
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content) {
                const replyText = data.candidates[0].content.parts[0].text;
                appendMessage(replyText, 'chappy-message');
                chatHistory.push({ role: "model", parts: [{ text: replyText }] });
            } else {
                appendMessage("ごめんにゃ、うまく言葉が出てこなかったにゃ……もう一度話しかけてほしいにゃ！", 'chappy-message');
            }
        } catch (error) {
            console.error(error);
            appendMessage("電波が届かなかったみたいにゃ。もう一度送ってみてほしいにゃ！", 'chappy-message');
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
