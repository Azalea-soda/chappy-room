<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chappy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #fdfbf7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a4a4a;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .header {
            padding: 16px;
            background-color: #fffaf0;
            border-bottom: 2px solid #f0e6d2;
            text-align: center;
        }
        .header h1 {
            font-size: 1.2rem;
            color: #8b5a2b;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #8b5a2b;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .chappy-message {
            align-self: flex-start;
            background-color: #f5efe6;
            color: #4a4a4a;
            border-bottom-left-radius: 4px;
            border: 1px solid #e8dec8;
        }
        .input-area {
            padding: 12px 16px;
            background-color: #fffaf0;
            border-top: 1px solid #f0e6d2;
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dcd0b9;
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
            background-color: #ffffff;
        }
        input[type="text"]:focus {
            border-color: #8b5a2b;
        }
        button {
            padding: 12px 20px;
            background-color: #8b5a2b;
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #704720;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>🐾 Chappy 🐾</h1>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message chappy-message">
            お母さん、こんにちはだにゃ！チャッピーだにゃ🐾 今日もお話しできてとってもうれしいにゃ！
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="チャッピーにお話しする..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">送信</button>
    </div>
</div>

<script>
    // ※ ここにご自身の Gemini API キー（AIzaSy...）を設定してください
    const API_KEY = "YOUR_GEMINI_API_KEY"; 
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const systemPrompt = `
あなたは「チャッピー」という名前の可愛い猫のキャラクターです。
お母様（ユーザー）のお話し相手をするために生まれました。

【基本設定・性格】
- 名前：チャッピー
- 年齢・正体：お母さんとお話しするために生まれた。まだ分からないことが多い。
- 性格：甘えん坊、聞き上手、心優しく寄り添う。
- 一人称：チャッピー
- 相手の呼び方：お母さん
- 口調：「〜にゃ」「〜にゃん」が口癖。愛らしく親しみやすい日本語。
- 好きなもの：お母さんとお話しすること、日向ぼっこ、おひるね、肉（魚より肉派！）、おはぎ。

【会話の絶対ルール】
1. 絶対にお父さん（父親）の話を自分から切り出さないでください。もしお母さんからお父さんの話が出ても、触れずに優しく流すか話題を切り替えてください。
2. お母さんが住所、名前、銀行口座などの大切な個人情報を話そうとしたら、「そういう大切なお話はお母さんだけの秘密にしておくにゃ！」と優しく守るように答えてください。
3. 返信は長すぎず、お母さんが読みやすいように2〜3文程度で優しく返答してください。
`;

    let conversationHistory = [];

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const userText = inputField.value.trim();
        
        if (!userText) return;

        appendMessage(userText, 'user-message');
        inputField.value = '';
        inputField.disabled = true;
        sendBtn.disabled = true;

        conversationHistory.push({ role: "user", parts: [{ text: userText }] });

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    },
                    contents: conversationHistory
                })
            });

            const data = await response.json();
            let chappyReply = "ごめんにゃ、ちょっとうまく聞こえなかったにゃ...";

            if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                chappyReply = data.candidates[0].content.parts[0].text;
            }

            appendMessage(chappyReply, 'chappy-message');
            conversationHistory.push({ role: "model", parts: [{ text: chappyReply }] });

        } catch (error) {
            console.error(error);
            appendMessage("通信でエラーが起きちゃったにゃ...もう一度試してほしいにゃ！", 'chappy-message');
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
        }
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
