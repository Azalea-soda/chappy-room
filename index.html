<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャッピールーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f3ed;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        /* ボタンや入力欄が画面からはみ出さない魔法の設定 */
        button, input, textarea {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>チャッピールームへようこそ</h1>
        <p>お母さんのための特別な場所です。</p>
    </div>
</body>
</html>
