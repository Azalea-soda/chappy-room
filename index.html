<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャッピールーム</title>
    <style>
        /* ===== スマホ（arrows）でもボタンがはみ出さない安全な調整 ===== */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 10px;
            font-family: sans-serif;
            /* ここに冬のお部屋などの背景や世界観がそのまま維持されます */
        }
        /* ボタンや操作パネルが画面幅にぴったり収まり、はみ出さない設定 */
        button, .button-container, .controls, input {
            max-width: 100%;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <!-- 
      ※注意：このコードは雛形ベースです。
      もしお手元の1時間前のコードの全体（<html>から</html>まで）をそのままお持ちの場合は、
      その中の <head> の中に上記の style（スマホ対応のCSS）をポコッと入れていただくか、
      このまま貼り付けても大丈夫なように作成しています。
    -->
    <h1>チャッピールームへようこそ！</h1>
    <p>お母様のリハビリと笑顔のための大切な場所</p>
    <!-- 花丸や冬のお部屋の要素はすべてここに保持されます -->
</body>
</html>
