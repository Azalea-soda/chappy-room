<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャッピーと一緒</title>
    <style>
        /* 聖域：現在のデザイン・背景・ボタン等の見た目は1ミリも変更していません */
        body {
            background-color: #e8f4f8;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center;
            justify-content: space-between;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        header {
            background-color: #7bc8a4;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.4;
        }
        .user-message {
            background-color: #dcf8c6;
            align-self: flex-end;
        }
        .chappy-message {
            background-color: #f1f0f0;
            align-self: flex-start;
        }
        .input-area {
            padding: 15px;
            background-color: #f9f9f9;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        button {
            background-color: #7bc8a4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background-color: #5fa884;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            🐾 チャッピー（お母さん専用AI）
        </header>

        <div class="chat-box" id="chatBox">
            <div class="message chappy-message">
                こんにちは！お母さん、今日も一緒に楽しくお話しよ🐾
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="ここに話しかけてね..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        // 【プロデューサー海さんへ：ここに新しいAPIキーを設定してください】
        // ※コードの中に直接貼るか、あるいは安全な環境から読み込ませます
        const API_KEY = "ここに新しいAPIキーを貼り付けてください"; 

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const userText = inputField.value.trim();

            if (!userText) return;

            // 1. ユーザーのメッセージを画面に表示
            appendMessage(userText, "user-message");
            inputField.value = "";

            // 2. チャッピーの「考える中身」を表示（ローディング風）
            const loadingId = appendMessage("うーんと考え中…🐾", "chappy-message");

            try {
                // 3. 正しい最新のモデル名（gemini-2.5-flash）でAPIを叩く
                const replyText = await callGeminiAPI(userText);
                
                // ローディングを実際の返答に書き換える
                updateMessage(loadingId, replyText);
                
                // 音声読み上げ（対応ブラウザ用）
                speakText(replyText);

            } catch (error) {
                console.error("エラー詳細:", error);
                updateMessage(loadingId, `（あれれ？うまくお返事できなかったみたい：${error.message}）`);
            }
        }

        // Gemini APIとの通信心臓部（エラーを隠さず、ループを防ぐ正常設計）
        async function callGeminiAPI(userMessage) {
            // ★ここが最大の修正ポイント：現在生きて動く最新モデルを指定
            const MODEL_NAME = 'gemini-2.5-flash';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userMessage }] }]
                })
            });

            // HTTPエラー（404やキー違いなど）をしっかり検知して止める
            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`通信エラー (${response.status})`);
            }

            const data = await response.json();

            // 正しく返答を取り出す
            if (
                data &&
                data.candidates &&
                data.candidates[0] &&
                data.candidates[0].content &&
                data.candidates[0].content.parts &&
                data.candidates[0].content.parts[0].text
            ) {
                return data.candidates[0].content.parts[0].text.trim();
            } else {
                throw new Error("AIからの返答形式が正しくありません");
            }
        }

        // 画面にメッセージを追加するヘルパー関数
        function appendMessage(text, className) {
            const chatBox = document.getElementById("chatBox");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv; // 後の書き換え用に要素を返す
        }

        function updateMessage(element, newText) {
            element.textContent = newText;
        }

        // 音声読み上げ機能
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                window.speechSynthesis.speak(utterance);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
