<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>チャッピーとお話し</title>
  <!-- Google Fonts: Kiwi Maru (太め500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kiwi Maru', serif;
      font-weight: 500; /* 元の太くてはっきりした文字 */
      letter-spacing: 0.03em;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
    }

    /* 全体画面（冬のお部屋 bg-winter.png） */
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-image: url('bg-winter.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 上部：LINE風会話スクロールエリア（元の半透明ボックスの位置とデザイン） */
    #chat-scroll-area {
      height: 38%; /* 元の上のすりガラスボックスと同じ高さ感 */
      margin: 20px 20px 0 20px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.45); /* 元の半透明ボックス背景 */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      -webkit-overflow-scrolling: touch;
      z-index: 10;
    }

    #chat-scroll-area::-webkit-scrollbar {
      width: 4px;
    }
    #chat-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 2px;
    }

    /* 共通吹き出しスタイル */
    .chat-bubble {
      max-width: 85%;
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 1.25rem; /* しっかり太く見やすい大きさ */
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 左側：チャッピーの吹き出し（くっきり白） */
    .bubble-chappy {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.95);
      color: #222222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* 右側：お母さんの吹き出し（オレンジ半透明） */
    .bubble-user {
      align-self: flex-end;
      background: rgba(255, 130, 0, 0.85);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* 中央：チャッピー画像エリア（元のドーンと大きい配置） */
    #character-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
      padding-bottom: 0px;
      z-index: 5;
    }

    #chappy-image {
      max-height: 95%;
      max-width: 90%;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
    }

    /* 下部：正解画像通りの白ボックスエリア */
    #bottom-card {
      background: #ffffff;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 20px 16px 28px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.12);
      z-index: 10;
    }

    /* 正解画像通りの「今日 0 回お話ししたにゃ🐾」表示 */
    #counter-text-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.3rem;
      color: #222222;
    }

    #hanamaru-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    #talk-count {
      font-size: 1.5rem;
      color: #e53935; /* 赤色でアクセント */
      margin: 0 2px;
    }

    /* マイクボタン（3つの状態・光る輪） */
    #mic-button {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      font-size: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* ① 待機中：白ボタン ＋ グレーの光る輪 */
    #mic-button.state-idle {
      background: #ffffff;
      color: #555555;
      box-shadow: 0 0 0 6px rgba(220, 220, 220, 0.6), 0 4px 12px rgba(0,0,0,0.15);
    }

    /* ② 聞き取り中：オレンジボタン ＋ オレンジの光る輪 */
    #mic-button.state-listening {
      background: #ff8c00;
      color: #ffffff;
      box-shadow: 0 0 0 8px rgba(255, 140, 0, 0.4), 0 4px 16px rgba(255, 140, 0, 0.5);
      animation: pulse-orange 1.5s infinite;
    }

    /* ③ チャッピーお返事中：青ボタン ＋ オレンジの光る輪 */
    #mic-button.state-speaking {
      background: #0072ff;
      color: #ffffff;
      box-shadow: 0 0 0 8px rgba(255, 140, 0, 0.5), 0 4px 16px rgba(0, 114, 255, 0.5);
    }

    @keyframes pulse-orange {
      0% { box-shadow: 0 0 0 4px rgba(255, 140, 0, 0.6), 0 4px 12px rgba(255, 140, 0, 0.3); }
      70% { box-shadow: 0 0 0 14px rgba(255, 140, 0, 0), 0 4px 12px rgba(255, 140, 0, 0.3); }
      100% { box-shadow: 0 0 0 4px rgba(255, 140, 0, 0), 0 4px 12px rgba(255, 140, 0, 0.3); }
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- 上部：LINE風スクロール吹き出しエリア（旧・文字表示エリアの位置） -->
    <div id="chat-scroll-area">
      <div class="chat-bubble bubble-chappy">
        お話しするにゃ！🐾
      </div>
    </div>

    <!-- 中央：チャッピー画像（cat-default.png） -->
    <div id="character-area">
      <img id="chappy-image" src="cat-default.png" alt="チャッピー">
    </div>

    <!-- 下部：正解画像通りの白ボックスエリア -->
    <div id="bottom-card">
      <div id="counter-text-line">
        <img id="hanamaru-icon" src="hanamaru.png" alt="はなまる">
        今日 <span id="talk-count">0</span> 回お話ししたにゃ🐾
      </div>

      <button id="mic-button" class="state-idle" onclick="toggleSpeech()">🎙️</button>
    </div>

  </div>

  <script>
    const chatScrollArea = document.getElementById('chat-scroll-area');
    const micButton = document.getElementById('mic-button');
    const talkCountEl = document.getElementById('talk-count');

    let talkCount = 0;
    let isRecording = false;
    let recognition = null;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        setButtonState('listening'); // オレンジ＋オレンジ輪
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text.trim() !== "") {
          addUserBubble(text);
          incrementCount();

          // チャッピーのお返事中ステート（青＋オレンジ輪）
          setButtonState('speaking');

          setTimeout(() => {
            addChappyBubble("しっかり聞こえたにゃ！「" + text + "」だね🐾");
            setButtonState('idle'); // 待機状態に戻る
          }, 1200);
        }
      };

      recognition.onerror = () => { setButtonState('idle'); };
      recognition.onend = () => { 
        if (micButton.classList.contains('state-listening')) {
          setButtonState('idle');
        }
      };
    } else {
      alert("お使いのブラウザは音声認識に対応していません。");
    }

    function toggleSpeech() {
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
        setButtonState('idle');
      } else {
        recognition.start();
      }
    }

    // ボタンの状態制御（白+グレー輪 / オレンジ+オレンジ輪 / 青+オレンジ輪）
    function setButtonState(state) {
      micButton.className = '';
      if (state === 'idle') {
        isRecording = false;
        micButton.classList.add('state-idle');
      } else if (state === 'listening') {
        isRecording = true;
        micButton.classList.add('state-listening');
      } else if (state === 'speaking') {
        isRecording = false;
        micButton.classList.add('state-speaking');
      }
    }

    // カウントアップ
    function incrementCount() {
      talkCount++;
      talkCountEl.textContent = talkCount;
    }

    // お母さんの吹き出し（右側・オレンジ半透明）
    function addUserBubble(text) {
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble bubble-user';
      bubble.textContent = text;
      chatScrollArea.appendChild(bubble);
      scrollToBottom();
    }

    // チャッピーの吹き出し（左側・白）
    function addChappyBubble(text) {
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble bubble-chappy';
      bubble.textContent = text;
      chatScrollArea.appendChild(bubble);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatScrollArea.scrollTo({
        top: chatScrollArea.scrollHeight,
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
